<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Inventario Vectores</title>

<style>

body{
margin:0;
font-family:"Segoe UI",Arial;
background:#f4f6f9;
color:#333;
}

header{
background:#1f3a5f;
color:#fff;
padding:14px 20px;
font-size:18px;
font-weight:600;
}

.container{
padding:20px;
}

.card{
background:#fff;
border-radius:6px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
padding:15px;
}

select,input{
width:100%;
padding:8px;
border:1px solid #ccc;
border-radius:4px;
}

.fab-group{
position:fixed;
right:25px;
bottom:25px;
display:flex;
flex-direction:column;
gap:12px;
}

.fab{
width:56px;
height:56px;
border-radius:50%;
color:#fff;
font-size:22px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
box-shadow:0 4px 12px rgba(0,0,0,.25);
}

.fab.insumo{background:#17a2b8;}
.fab.pres{background:#6f42c1;}
.fab.mov{background:#28a745;}

.drawer{
position:fixed;
top:0;
right:-480px;
width:420px;
height:100%;
background:#fff;
box-shadow:-4px 0 12px rgba(0,0,0,.2);
padding:20px;
transition:right .3s ease;
z-index:100;
overflow-y:auto;
}

.drawer.open{
right:0;
}

.drawer button{
margin-top:15px;
padding:8px;
border:none;
border-radius:4px;
background:#0069d9;
color:#fff;
cursor:pointer;
}

.btn-sec{
background:#6c757d;
}

</style>
</head>

<body>

<header>
Inventario Vectores
</header>

<div class="container">

<div class="card">
<h3>Carga de folios</h3>
<p>Los folios representan empaques físicos entregados a las jurisdicciones.</p>
</div>

</div>

<div class="fab-group">
<div class="fab insumo" onclick="openDrawer('drawerInsumo')">I</div>
<div class="fab pres" onclick="openDrawer('drawerPres')">P</div>
<div class="fab mov" onclick="openDrawer('drawerFolios')">F</div>
</div>

<!-- INSUMO -->

<div class="drawer" id="drawerInsumo">

<h3>Registrar insumo</h3>

<form id="formInsumo">

<label>Nombre</label>
<input id="nombre_insumo" required>

<label>Categoría</label>
<select id="categoria" required>
<option value="">Seleccione</option>
<option value="Adulticida">Adulticida</option>
<option value="Larvicida">Larvicida</option>
<option value="Otro">Otro</option>
</select>

<label>
Permitir gasto parcial
<input type="checkbox" id="tipo_gasto">
</label>

<button>Guardar</button>
<button type="button" class="btn-sec" onclick="closeDrawer()">Cerrar</button>

</form>

</div>

<!-- PRESENTACION -->

<div class="drawer" id="drawerPres">

<h3>Registrar presentación</h3>

<form id="formPresentacion">

<label>Insumo</label>
<select id="id_insumo_pres" required></select>

<label>Descripción</label>
<input id="descripcion" required>

<label>Unidad</label>
<input id="unidad_medida" required>

<label>Factor conversión</label>
<input type="number" id="factor_conversion" step="0.01" required>

<button>Guardar</button>
<button type="button" class="btn-sec" onclick="closeDrawer()">Cerrar</button>

</form>

</div>

<!-- FOLIOS -->

<div class="drawer" id="drawerFolios">

<h3>Cargar folios</h3>

<form id="formFolios">

<label>Insumo</label>
<select id="id_insumo_lote" required></select>

<label>Presentación</label>
<select id="id_presentacion" required></select>

<label>Lote</label>
<input id="lote" required>

<label>Fecha de caducidad</label>
<input id="fecha_caducidad" type="date" required>

<label>Fecha de llegada</label>
<input id="fecha_llegada" type="date" required>

<label>Proveedor</label>
<input id="proveedor">


<label>Jurisdicción</label>
<select id="id_almacen" required></select>

<label>Folio inicial</label>
<input id="folio_inicio" type="number" required>

<label>Folio final</label>
<input id="folio_fin" type="number" required>

<button>Cargar folios</button>
<button type="button" class="btn-sec" onclick="closeDrawer()">Cerrar</button>

</form>

</div>

<script>

function openDrawer(id){
closeDrawer();
document.getElementById(id).classList.add("open");
}

function closeDrawer(){
document.querySelectorAll(".drawer").forEach(d=>d.classList.remove("open"));
}

</script>

<script type="module" src="js/vectores.js"></script>

</body>
</html>
